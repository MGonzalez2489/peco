<app-auth-layout title="Iniciar sesión" subtitle="Entra para ver tus finanzas.">
  <form class="space-y-5" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="space-y-1.5">
      <label for="login-email" class="block text-sm font-medium text-slate-700 dark:text-slate-300">
        Correo electrónico
      </label>
      <input
        id="login-email"
        type="email"
        formControlName="email"
        autocomplete="email"
        placeholder="tu@correo.com"
        [attr.aria-invalid]="errorFor(form.controls.email) ? 'true' : null"
        [attr.aria-describedby]="errorFor(form.controls.email) ? 'login-email-error' : null"
        class="w-full rounded-xl border bg-white px-3 py-2.5 text-sm text-slate-900 shadow-sm outline-none focus:ring-2 focus:ring-indigo-500/20 dark:bg-slate-800 dark:text-white"
        [class.border-rose-400]="errorFor(form.controls.email)"
        [class.border-slate-300]="!errorFor(form.controls.email)"
      />
      @if (errorFor(form.controls.email); as message) {
        <p id="login-email-error" role="alert" class="text-xs font-medium text-rose-600">
          {{ message }}
        </p>
      }
    </div>

    <div class="space-y-1.5">
      <label
        for="login-password"
        class="block text-sm font-medium text-slate-700 dark:text-slate-300"
      >
        Contraseña
      </label>
      <div class="relative">
        <input
          id="login-password"
          [type]="showPassword() ? 'text' : 'password'"
          formControlName="password"
          autocomplete="current-password"
          [attr.aria-invalid]="errorFor(form.controls.password) ? 'true' : null"
          [attr.aria-describedby]="errorFor(form.controls.password) ? 'login-password-error' : null"
          class="w-full rounded-xl border bg-white px-3 py-2.5 pr-11 text-sm text-slate-900 shadow-sm outline-none focus:ring-2 focus:ring-indigo-500/20 dark:bg-slate-800 dark:text-white"
          [class.border-rose-400]="errorFor(form.controls.password)"
          [class.border-slate-300]="!errorFor(form.controls.password)"
        />
        <button
          type="button"
          (click)="showPassword.update((visible) => !visible)"
          [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
          class="absolute inset-y-0 right-0 flex w-11 items-center justify-center text-slate-400 hover:text-slate-600 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500"
        >
          <app-icon
            [name]="showPassword() ? 'eye-off' : 'eye'"
            size="18"
            class="h-[18px] w-[18px]"
          />
        </button>
      </div>
      @if (errorFor(form.controls.password); as message) {
        <p id="login-password-error" role="alert" class="text-xs font-medium text-rose-600">
          {{ message }}
        </p>
      }
    </div>

    <button
      type="submit"
      [disabled]="submitting()"
      class="w-full rounded-xl bg-indigo-600 px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-indigo-500 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-60"
    >
      {{ submitting() ? 'Entrando…' : 'Entrar' }}
    </button>
  </form>

  <div class="mt-5 flex items-center justify-between text-xs font-medium text-indigo-600">
    <a routerLink="/forgot-password" class="hover:underline">¿Olvidaste tu contraseña?</a>
    <a routerLink="/register" class="hover:underline">Crear cuenta</a>
  </div>
</app-auth-layout>
