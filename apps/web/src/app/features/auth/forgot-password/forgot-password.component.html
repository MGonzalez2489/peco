<app-auth-layout
  title="Recuperar contraseña"
  subtitle="Te enviaremos un enlace para restablecerla."
>
  @if (submitted()) {
    <div
      role="status"
      class="rounded-2xl border border-emerald-200 bg-emerald-50 p-4 text-sm text-emerald-800 dark:border-emerald-900/60 dark:bg-emerald-950/30 dark:text-emerald-200"
    >
      <app-icon name="check" size="20" class="h-5 w-5" />
      <p class="mt-2">
        Si el correo está registrado, recibirás un enlace para crear una contraseña nueva.
      </p>
    </div>
    <a
      routerLink="/login"
      class="mt-5 block text-center text-xs font-semibold text-indigo-600 hover:underline"
    >
      Volver a iniciar sesión
    </a>
  } @else {
    <form class="space-y-5" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="space-y-1.5">
        <label
          for="forgot-email"
          class="block text-sm font-medium text-slate-700 dark:text-slate-300"
        >
          Correo electrónico
        </label>
        <input
          id="forgot-email"
          type="email"
          formControlName="email"
          autocomplete="email"
          placeholder="tu@correo.com"
          [attr.aria-invalid]="errorFor(form.controls.email) ? 'true' : null"
          [attr.aria-describedby]="errorFor(form.controls.email) ? 'forgot-email-error' : null"
          class="w-full rounded-xl border bg-white px-3 py-2.5 text-sm text-slate-900 shadow-sm outline-none focus:ring-2 focus:ring-indigo-500/20 dark:bg-slate-800 dark:text-white"
          [class.border-rose-400]="errorFor(form.controls.email)"
          [class.border-slate-300]="!errorFor(form.controls.email)"
        />
        @if (errorFor(form.controls.email); as message) {
          <p id="forgot-email-error" role="alert" class="text-xs font-medium text-rose-600">
            {{ message }}
          </p>
        }
      </div>

      <button
        type="submit"
        [disabled]="submitting()"
        class="w-full rounded-xl bg-indigo-600 px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-indigo-500 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-60"
      >
        {{ submitting() ? 'Enviando…' : 'Enviar enlace' }}
      </button>
    </form>

    <a
      routerLink="/login"
      class="mt-5 block text-center text-xs font-semibold text-indigo-600 hover:underline"
    >
      Volver a iniciar sesión
    </a>
  }
</app-auth-layout>
