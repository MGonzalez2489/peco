name: Release & Changelog

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Release & changelog
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate changelog & bump version
        run: node scripts/generate-changelog.js

      - name: Commit, tag & push release
        run: |
          if [ -z "$(git status --porcelain -- package.json src/assets/changelog.json)" ]; then
            echo "No feat/fix commits since the last release tag. Skipping."
            exit 0
          fi

          VERSION="$(node -p "require('./src/assets/changelog.json')[0].version")"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json src/assets/changelog.json
          git commit -m "chore(release): bump version to ${VERSION} [skip ci]"
          git tag "${VERSION}"
          git push origin HEAD:main
          git push origin "refs/tags/${VERSION}"