name: CI

on:
  push:
    branches: [main, backend]
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: peco
          MYSQL_USER: peco
          MYSQL_PASSWORD: peco
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      NODE_ENV: test
      TZ: UTC
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: 3306
      DATABASE_NAME: peco
      DATABASE_USER: peco
      DATABASE_PASSWORD: peco
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: tree:0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm audit --audit-level=critical

      - uses: nrwl/nx-set-shas@v4

      - run: npx nx affected -t lint typecheck test build --base=origin/main
      - run: npm run test:e2e
      - run: npx nx format:check --base=origin/main
