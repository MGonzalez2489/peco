<div
  class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm dark:border-slate-800 dark:bg-slate-900"
>
  <div class="flex items-start justify-between gap-3">
    <div class="min-w-0">
      <h2 class="text-sm font-semibold uppercase tracking-wide text-slate-500 dark:text-slate-400">
        Ingresos y egresos
      </h2>
      <p class="mt-0.5 truncate text-xs text-slate-400 dark:text-slate-500">{{ periodLabel() }}</p>
    </div>
    <div class="text-right">
      <span class="block text-[11px] font-medium text-slate-400 dark:text-slate-500">Balance</span>
      <span class="text-sm font-bold tabular-nums text-slate-900 dark:text-white">
        {{ netBalance() | privacyCurrency }}
      </span>
    </div>
  </div>

  @if (hasData()) {
    <div class="mt-2" role="img" [attr.aria-label]="ariaLabel()">
      <apx-chart
        [series]="series()"
        [chart]="chart()"
        [labels]="labels"
        [colors]="colors"
        [plotOptions]="plotOptions()"
        [dataLabels]="dataLabels()"
        [stroke]="stroke()"
        [legend]="legend()"
        [theme]="theme()"
        [tooltip]="tooltip()"
      />
    </div>
  } @else {
    <p
      class="mt-6 rounded-xl border border-dashed border-slate-300 p-4 text-center text-sm text-slate-500 dark:border-slate-700 dark:text-slate-400"
    >
      No hay ingresos ni egresos registrados en este período.
    </p>
  }
</div>
