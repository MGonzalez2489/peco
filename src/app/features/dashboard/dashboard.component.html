<section class="space-y-6">
  <div>
    <h1 class="text-2xl font-bold tracking-tight text-slate-900 dark:text-white">Resumen</h1>
    <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">Así van tus finanzas hoy.</p>
  </div>

  <app-stat-card
    title="Saldo total"
    [amount]="totalBalance()"
    color="indigo"
    subtext="Suma de todos tus apartados"
  />

  <div class="mt-8">
    <h2
      class="mb-4 text-sm font-semibold uppercase tracking-wide text-slate-500 dark:text-slate-400"
    >
      Apartados
    </h2>
    @if (apartadosFijados().length === 0) {
      <div
        class="rounded-2xl border-2 border-dashed border-slate-300 p-4 text-center dark:border-slate-700"
      >
        <p class="text-sm font-medium text-slate-700 dark:text-slate-300">
          No tienes apartados fijados en Inicio.
        </p>
        <a
          [routerLink]="['/categories']"
          class="mt-2 inline-flex text-sm font-semibold text-indigo-600 transition hover:text-indigo-500 dark:text-indigo-400 dark:hover:text-indigo-300"
        >
          Gestionar apartados
        </a>
      </div>
    } @else {
      <div class="no-scrollbar flex snap-x snap-mandatory gap-4 overflow-x-auto pb-2">
        @for (category of apartadosFijados(); track category.id) {
          <a
            [routerLink]="['/categories', category.id]"
            class="w-[82%] shrink-0 snap-start rounded-2xl focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:ring-offset-2 dark:focus-visible:ring-offset-slate-950 sm:w-[280px]"
            [attr.aria-label]="'Ver detalle de ' + category.name"
          >
            <app-stat-card
              [title]="category.name"
              [amount]="category.currentBalance"
              [color]="category.color ?? 'indigo'"
              [goal]="category.targetGoal"
              [subtext]="categorySubtext(category)"
            />
          </a>
        }
      </div>
    }
  </div>

  <div class="mt-8">
    <div class="mb-4 flex items-center justify-between gap-4">
      <h2 class="text-sm font-semibold uppercase tracking-wide text-slate-500 dark:text-slate-400">
        Actividad reciente
      </h2>
      <a
        [routerLink]="['/movements']"
        class="shrink-0 text-sm font-semibold text-indigo-600 transition hover:text-indigo-500 dark:text-indigo-400 dark:hover:text-indigo-300"
      >
        Ver todas
      </a>
    </div>
    <app-movement-list [movements]="recentMovements()" emptyMessage="Todavía no hay movimientos." />
  </div>
</section>
