<app-modal [isOpen]="isOpen()" title="Aplicar programado" (closed)="closed.emit()">
  <p class="mt-4 text-sm text-slate-600 dark:text-slate-300">
    Se registrará el movimiento <strong>{{ name() }}</strong> con el monto que definas aquí. El
    monto estimado es <strong>{{ estimatedLabel() }}</strong
    >.
  </p>

  <form [formGroup]="form" (ngSubmit)="apply()" class="mt-5 space-y-4" novalidate>
    <div>
      <label
        for="exec-amount"
        class="mb-1.5 block text-sm font-medium text-slate-700 dark:text-slate-300"
      >
        Monto real
      </label>
      <input
        id="exec-amount"
        formControlName="amount"
        appCurrencyInput
        type="text"
        inputmode="decimal"
        autocomplete="off"
        class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2.5 text-sm text-slate-900 shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 dark:border-slate-700 dark:bg-slate-800 dark:text-white"
        [attr.aria-invalid]="form.controls.amount.touched && form.controls.amount.invalid"
      />
      @if (form.controls.amount.touched && form.controls.amount.invalid) {
        <p class="mt-1 text-xs text-rose-600 dark:text-rose-400">Ingresa un monto mayor a cero.</p>
      }
    </div>

    <button
      type="button"
      (click)="useEstimate()"
      class="rounded-lg border border-slate-200 px-3 py-1.5 text-xs font-semibold text-slate-600 transition hover:border-indigo-300 hover:text-indigo-600 dark:border-slate-700 dark:text-slate-300 dark:hover:border-indigo-500/60 dark:hover:text-indigo-400"
    >
      Usar el monto estimado
    </button>

    <div class="flex justify-end gap-2 pt-2">
      <button
        type="button"
        (click)="closed.emit()"
        class="rounded-xl px-4 py-2.5 text-sm font-semibold text-slate-600 transition hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800"
      >
        Cancelar
      </button>
      <button
        type="submit"
        class="rounded-xl bg-indigo-600 px-5 py-2.5 text-sm font-semibold text-white shadow-sm shadow-indigo-600/30 transition hover:bg-indigo-500 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:ring-offset-2 dark:focus-visible:ring-offset-slate-900"
      >
        Aplicar
      </button>
    </div>
  </form>
</app-modal>
