<app-modal [isOpen]="isOpen()" title="Filtros" (closed)="closed.emit()">
  <div class="slide-up mt-5 space-y-5">
    <div>
      <label
        for="filtros-scheduled-search"
        class="mb-1.5 block text-sm font-medium text-slate-700 dark:text-slate-300"
      >
        Buscar por nombre
      </label>
      <input
        id="filtros-scheduled-search"
        type="text"
        [(ngModel)]="searchQuery"
        placeholder="Ej. Renta, Netflix..."
        class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2.5 text-sm text-slate-900 shadow-sm placeholder:text-slate-400 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 dark:border-slate-700 dark:bg-slate-800 dark:text-white"
      />
    </div>

    <div>
      <span
        id="filtros-tipo"
        class="mb-1.5 block text-sm font-medium text-slate-700 dark:text-slate-300"
      >
        Tipo
      </span>
      <div
        role="group"
        aria-labelledby="filtros-tipo"
        class="no-scrollbar flex gap-1 overflow-x-auto rounded-xl bg-slate-100 p-1 dark:bg-slate-800"
      >
        @for (option of typeOptions; track option.value) {
          <button
            type="button"
            (click)="type.set(option.value)"
            [class]="
              type() === option.value
                ? 'flex-1 whitespace-nowrap rounded-lg bg-white px-3 py-1.5 text-sm font-semibold text-slate-900 shadow-sm dark:bg-slate-900 dark:text-white'
                : 'flex-1 whitespace-nowrap rounded-lg px-3 py-1.5 text-sm font-medium text-slate-500 hover:text-slate-900 dark:text-slate-400 dark:hover:text-white'
            "
            [attr.aria-pressed]="type() === option.value"
          >
            {{ option.label }}
          </button>
        }
      </div>
    </div>

    <div>
      <label
        for="filtros-scheduled-categoria"
        class="mb-1.5 block text-sm font-medium text-slate-700 dark:text-slate-300"
      >
        Filtrar por categoría
      </label>
      <select
        id="filtros-scheduled-categoria"
        (change)="categoryId.set($any($event.target).value || null)"
        class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2.5 text-sm text-slate-900 shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 dark:border-slate-700 dark:bg-slate-800 dark:text-white"
      >
        <option value="">Todas las categorías</option>
        @for (category of categories(); track category.id) {
          <option [value]="category.id" [selected]="category.id === categoryId()">
            {{ category.displayName }}
          </option>
        }
      </select>
    </div>

    <div class="flex gap-2 pt-1">
      <button
        type="button"
        (click)="clear()"
        class="flex-1 rounded-xl border border-slate-200 px-4 py-2.5 text-sm font-semibold text-slate-600 transition hover:bg-slate-100 dark:border-slate-700 dark:text-slate-300 dark:hover:bg-slate-800"
      >
        Limpiar filtros
      </button>
      <button
        type="button"
        (click)="apply()"
        class="flex-1 rounded-xl bg-indigo-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm shadow-indigo-600/30 transition hover:bg-indigo-500 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:ring-offset-2 dark:focus-visible:ring-offset-slate-900"
      >
        Aplicar filtros
      </button>
    </div>
  </div>
</app-modal>
