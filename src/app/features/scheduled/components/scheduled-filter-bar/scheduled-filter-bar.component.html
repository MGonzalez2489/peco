<div
  class="flex flex-col gap-3 rounded-2xl border border-slate-200 bg-white p-4 dark:border-slate-800 dark:bg-slate-900 sm:flex-row sm:items-center sm:justify-between"
>
  <div class="relative w-full sm:max-w-xs">
    <app-icon
      name="search"
      size="16"
      class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-400 dark:text-slate-500"
    />
    <input
      type="text"
      [(ngModel)]="searchQueryLocal"
      (input)="onSearchInput()"
      placeholder="Buscar por nombre..."
      class="w-full rounded-xl border border-slate-300 bg-white py-2.5 pl-12 pr-3 text-sm text-slate-900 shadow-sm placeholder:text-slate-400 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 dark:border-slate-700 dark:bg-slate-800 dark:text-white"
      aria-label="Buscar por nombre"
    />
  </div>

  <div class="flex flex-wrap items-center gap-2">
    <div
      class="inline-flex rounded-xl border border-slate-200 bg-slate-50 p-1 dark:border-slate-700 dark:bg-slate-800/60"
    >
      <button
        type="button"
        (click)="setTypeFilter('ALL')"
        [attr.aria-pressed]="scheduledStore.typeFilter() === 'ALL'"
        [class]="
          scheduledStore.typeFilter() === 'ALL'
            ? 'rounded-lg bg-indigo-600 px-3 py-1.5 text-xs font-semibold text-white shadow-sm transition'
            : 'rounded-lg px-3 py-1.5 text-xs font-semibold text-slate-600 transition hover:text-slate-900 dark:text-slate-300 dark:hover:text-white'
        "
      >
        Todos ({{ scheduledStore.totalFilteredCount() }})
      </button>
      <button
        type="button"
        (click)="setTypeFilter('INCOME')"
        [attr.aria-pressed]="scheduledStore.typeFilter() === 'INCOME'"
        [class]="
          scheduledStore.typeFilter() === 'INCOME'
            ? 'rounded-lg bg-indigo-600 px-3 py-1.5 text-xs font-semibold text-white shadow-sm transition'
            : 'rounded-lg px-3 py-1.5 text-xs font-semibold text-slate-600 transition hover:text-slate-900 dark:text-slate-300 dark:hover:text-white'
        "
      >
        Ingresos ({{ scheduledStore.incomeFilteredCount() }})
      </button>
      <button
        type="button"
        (click)="setTypeFilter('EXPENSE')"
        [attr.aria-pressed]="scheduledStore.typeFilter() === 'EXPENSE'"
        [class]="
          scheduledStore.typeFilter() === 'EXPENSE'
            ? 'rounded-lg bg-indigo-600 px-3 py-1.5 text-xs font-semibold text-white shadow-sm transition'
            : 'rounded-lg px-3 py-1.5 text-xs font-semibold text-slate-600 transition hover:text-slate-900 dark:text-slate-300 dark:hover:text-white'
        "
      >
        Egresos ({{ scheduledStore.expenseFilteredCount() }})
      </button>
    </div>

    <div class="relative">
      <select
        [ngModel]="scheduledStore.selectedCategoryId()"
        (ngModelChange)="setCategoryFilter($event)"
        class="w-full appearance-none rounded-xl border border-slate-300 bg-white px-3 py-2.5 pr-10 text-sm text-slate-900 shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 dark:border-slate-700 dark:bg-slate-800 dark:text-white"
        aria-label="Filtrar por categoría"
      >
        <option [value]="null">Todas las categorías</option>
        @for (category of catalogStore.categories(); track category.id) {
          <option [value]="category.id">{{ category.displayName }}</option>
        }
      </select>
      <app-icon
        name="chevron-down"
        size="16"
        class="pointer-events-none absolute right-3 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-400 dark:text-slate-500"
      />
    </div>

    @if (
      scheduledStore.searchQuery() ||
      scheduledStore.typeFilter() !== 'ALL' ||
      scheduledStore.selectedCategoryId()
    ) {
      <button
        type="button"
        (click)="resetFilters()"
        class="rounded-xl px-3 py-2 text-xs font-semibold text-slate-600 transition hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800"
      >
        Limpiar filtros
      </button>
    }
  </div>
</div>
