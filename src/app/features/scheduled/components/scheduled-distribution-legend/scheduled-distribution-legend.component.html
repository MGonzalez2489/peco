<div class="flex-1 space-y-2">
  @for (item of items(); track item.categoryId) {
    <button
      type="button"
      (click)="categorySelected.emit(item.categoryId)"
      [attr.aria-pressed]="item.categoryId === selectedCategoryId()"
      [class]="
        item.categoryId === selectedCategoryId()
          ? 'flex w-full items-center justify-between gap-1 rounded-xl border border-indigo-500 bg-indigo-50/60 px-3 py-2 text-left transition hover:bg-indigo-50 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 dark:border-indigo-400 dark:bg-indigo-500/10 dark:hover:bg-indigo-500/20'
          : 'flex w-full items-center justify-between gap-1 rounded-xl border border-slate-200 bg-white px-3 py-2 text-left transition hover:bg-slate-50 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 dark:border-slate-800 dark:bg-slate-900 dark:hover:bg-slate-800/60'
      "
    >
      <span class="flex min-w-0 items-center gap-2">
        <span
          aria-hidden="true"
          class="h-2.5 w-2.5 shrink-0 rounded-full"
          [style.background-color]="item.color"
        ></span>
        <span class="truncate text-sm font-medium text-slate-700 dark:text-slate-200">
          {{ item.categoryName }}
        </span>
      </span>

      <span class="flex shrink-0 items-center text-sm text-slate-900 dark:text-white">
        <span
          class="w-20 shrink-0 text-right font-medium whitespace-nowrap tabular-nums text-slate-500"
        >
          {{ item.amount | currency: 'USD' : 'symbol' : '1.2-2' }}
        </span>
        <span class="w-12 shrink-0 text-right font-semibold whitespace-nowrap tabular-nums">
          ({{ item.percentage }}%)
        </span>
      </span>
    </button>
  }

  @if (selectedCategoryId()) {
    <button
      type="button"
      (click)="clearSelection.emit()"
      class="w-full rounded-xl px-3 py-1.5 text-xs font-semibold text-indigo-600 transition hover:bg-indigo-50 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 dark:text-indigo-400 dark:hover:bg-indigo-500/10"
    >
      Limpiar selección de categoría
    </button>
  }
</div>
