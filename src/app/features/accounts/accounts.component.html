<div class="space-y-6 lg:space-y-8">
  <!-- PAGE HEADER -->
  <div class="flex items-center justify-between gap-4">
    <div class="min-w-0">
      <h1 class="text-2xl font-extrabold tracking-tight text-slate-900 lg:text-3xl dark:text-white">
        Cuentas
      </h1>
      <p class="mt-1 truncate text-xs text-slate-500 lg:text-sm dark:text-slate-400">
        {{ accountCount() }} registradas · Total:
        <span class="font-semibold text-slate-700 dark:text-slate-200">
          {{ formatCurrency(totalBalance()) }}
        </span>
      </p>
    </div>
    <button
      type="button"
      (click)="openCreateModal()"
      class="inline-flex shrink-0 items-center gap-2 rounded-xl bg-indigo-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm shadow-indigo-600/30 transition hover:bg-indigo-500 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:ring-offset-2 active:scale-95 dark:focus-visible:ring-offset-slate-950"
    >
      <app-icon name="plus" size="16" class="h-4 w-4" />
      Crear
    </button>
  </div>

  @if (accounts().length === 0) {
    <!-- EMPTY STATE -->
    <div
      class="flex flex-col items-center justify-center gap-3 rounded-2xl border-2 border-dashed border-slate-300 p-10 text-center dark:border-slate-700"
    >
      <p class="text-sm font-semibold text-slate-700 dark:text-slate-200">
        Todavía no tienes cuentas.
      </p>
      <p class="text-xs text-slate-500 dark:text-slate-400">
        Crea tu primera cuenta para empezar a organizar tu dinero.
      </p>
      <button
        type="button"
        (click)="openCreateModal()"
        class="mt-1 inline-flex items-center gap-1.5 rounded-xl bg-indigo-600 px-4 py-2 text-xs font-semibold text-white shadow-sm transition-all hover:bg-indigo-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:ring-offset-2 active:scale-95 dark:focus-visible:ring-offset-slate-950"
      >
        <app-icon name="plus" size="16" class="h-4 w-4" />
        Nueva Cuenta
      </button>
    </div>
  } @else {
    <!-- RESPONSIVE GRID: chart on top (mobile) / right (desktop), list on bottom (mobile) / left (desktop) -->
    <div class="grid grid-cols-1 gap-6 lg:grid-cols-3 lg:gap-8">
      <!-- CHART COLUMN -->
      <div class="space-y-6 lg:order-2 lg:col-span-1">
        <div
          class="rounded-2xl border border-slate-200/80 bg-white p-5 shadow-sm dark:border-slate-800 dark:bg-slate-900"
        >
          <h2
            class="mb-4 text-xs font-bold tracking-wider text-slate-400 uppercase dark:text-slate-500"
          >
            Distribución
          </h2>
          <app-account-distribution-chart [accounts]="accounts()" [totalBalance]="totalBalance()" />
        </div>

        <button
          type="button"
          (click)="openTransferModal()"
          class="hidden w-full items-center justify-center gap-2 rounded-xl bg-slate-100 py-2.5 text-xs font-semibold text-slate-700 transition-colors hover:bg-slate-200 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:ring-offset-2 lg:flex dark:bg-slate-800 dark:text-slate-200 dark:hover:bg-slate-700 dark:focus-visible:ring-offset-slate-900"
        >
          <app-icon name="arrow-left-right" size="16" class="h-4 w-4" />
          Transferir entre cuentas
        </button>
      </div>

      <!-- UNIFIED ACCOUNTS LIST -->
      <div class="lg:order-1 lg:col-span-2">
        <div
          class="divide-y divide-slate-100 overflow-hidden rounded-2xl border border-slate-200/80 bg-white shadow-sm dark:divide-slate-800 dark:border-slate-800 dark:bg-slate-900"
        >
          @for (account of accounts(); track account.id) {
            <button
              type="button"
              (click)="openEditModal(account)"
              [attr.aria-label]="'Editar cuenta ' + account.name"
              class="group flex w-full cursor-pointer items-center justify-between gap-3 p-4 text-left transition-colors hover:bg-slate-50/80 focus:outline-none focus-visible:bg-slate-50 dark:hover:bg-slate-800/60 dark:focus-visible:bg-slate-800/60"
            >
              <div class="flex min-w-0 items-center gap-3">
                <span
                  class="h-3.5 w-3.5 shrink-0 rounded-full"
                  [style.backgroundColor]="accountColor(account.color).chip"
                ></span>
                <div class="min-w-0">
                  <div class="flex items-center gap-2">
                    <span class="truncate text-sm font-semibold text-slate-900 dark:text-white">
                      {{ account.name }}
                    </span>
                    @if (account.isRoot) {
                      <span
                        class="shrink-0 rounded-md border border-slate-200 bg-slate-100 px-2 py-0.5 text-[10px] font-medium text-slate-600 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-300"
                      >
                        Base
                      </span>
                    }
                  </div>
                  @if (account.note) {
                    <p class="truncate text-xs text-slate-400 dark:text-slate-500">
                      {{ account.note }}
                    </p>
                  }
                </div>
              </div>

              <div class="flex shrink-0 items-center gap-3">
                <span
                  class="text-sm font-bold tabular-nums"
                  [class]="
                    account.currentBalance < 0
                      ? 'text-rose-600 dark:text-rose-400'
                      : 'text-slate-900 dark:text-white'
                  "
                >
                  {{ formatCurrency(account.currentBalance) }}
                </span>
                <app-icon
                  name="chevron-right"
                  size="16"
                  class="h-4 w-4 text-slate-300 transition-colors group-hover:text-slate-400 dark:text-slate-600"
                />
              </div>
            </button>
          }
        </div>
      </div>
    </div>
  }
</div>

<app-account-form-modal
  [isOpen]="createModalOpen()"
  [account]="null"
  (closed)="createModalOpen.set(false)"
/>

<app-account-form-modal
  [isOpen]="editingAccount() !== null"
  [account]="editingAccount()"
  (closed)="closeEditModal()"
/>

<app-movement-form-modal
  [isOpen]="transferModalOpen()"
  [presetType]="'TRANSFER'"
  (closed)="transferModalOpen.set(false)"
/>
