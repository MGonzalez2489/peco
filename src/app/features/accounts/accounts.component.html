<section class="space-y-6">
  <div>
    <h1 class="text-2xl font-bold tracking-tight text-slate-900 dark:text-white">Cuentas</h1>
    <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">
      Apartados con saldo y meta para organizar tu dinero.
    </p>
  </div>

  <div
    class="grid grid-cols-3 gap-2 rounded-2xl border border-slate-200 bg-white p-3 shadow-sm md:hidden dark:border-slate-800 dark:bg-slate-900"
  >
    <div class="text-center">
      <p
        class="text-[10px] font-semibold uppercase tracking-wide text-slate-500 dark:text-slate-400"
      >
        Total Repartido
      </p>
      <p class="mt-1 text-sm font-bold text-slate-900 dark:text-white">
        {{ formatCurrency(totalBalance()) }}
      </p>
    </div>
    <div class="text-center">
      <p
        class="text-[10px] font-semibold uppercase tracking-wide text-slate-500 dark:text-slate-400"
      >
        Disponible para Gastar
      </p>
      <p class="mt-1 text-sm font-bold text-indigo-600 dark:text-indigo-400">
        {{ formatCurrency(availableBalance()) }}
      </p>
    </div>
    <div class="text-center">
      <p
        class="text-[10px] font-semibold uppercase tracking-wide text-slate-500 dark:text-slate-400"
      >
        Total Cuentas
      </p>
      <p class="mt-1 text-sm font-bold text-slate-900 dark:text-white">{{ accountCount() }}</p>
    </div>
  </div>

  <button
    type="button"
    (click)="modalOpen.set(true)"
    class="flex w-full items-center justify-center gap-2 rounded-xl border border-slate-300 bg-white px-4 py-2.5 text-sm font-semibold text-slate-700 transition hover:border-indigo-400 hover:text-indigo-600 md:hidden dark:border-slate-700 dark:bg-slate-900 dark:text-slate-300 dark:hover:border-indigo-500 dark:hover:text-indigo-400"
  >
    <app-icon name="plus" size="16" class="h-4 w-4" />
    Nueva cuenta
  </button>

  <div class="grid grid-cols-1 gap-4 md:grid-cols-2 lg:grid-cols-3">
    @for (account of accounts(); track account.id) {
      <app-account-card [account]="account" />
    }

    <button
      type="button"
      (click)="modalOpen.set(true)"
      class="hidden min-h-32 flex-col items-center justify-center gap-2 rounded-2xl border-2 border-dashed border-slate-300 text-slate-500 transition hover:border-indigo-400 hover:text-indigo-600 md:flex dark:border-slate-700 dark:text-slate-400 dark:hover:border-indigo-500 dark:hover:text-indigo-400"
    >
      <span
        class="flex h-10 w-10 items-center justify-center rounded-full bg-slate-100 dark:bg-slate-800"
      >
        <app-icon name="plus" size="20" class="h-5 w-5" />
      </span>
      <span class="text-sm font-semibold">Nueva cuenta</span>
    </button>
  </div>
</section>

<app-account-form-modal [isOpen]="modalOpen()" [account]="null" (closed)="modalOpen.set(false)" />
