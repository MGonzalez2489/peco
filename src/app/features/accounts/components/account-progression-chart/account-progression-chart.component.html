<div class="relative" role="img" [attr.aria-label]="ariaLabel()">
  <apx-chart
    [chart]="chart()"
    [series]="series()"
    [stroke]="stroke()"
    [markers]="markers()"
    [fill]="fill()"
    [colors]="colors()"
    [grid]="grid()"
    [xaxis]="xaxis()"
    [yaxis]="yaxis()"
    [dataLabels]="dataLabels()"
    [theme]="theme()"
    [tooltip]="tooltip()"
  />
</div>
