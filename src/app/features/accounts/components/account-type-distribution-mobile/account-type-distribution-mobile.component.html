<div
  class="rounded-2xl border border-slate-200/80 bg-white p-2 shadow-sm dark:border-slate-800 dark:bg-slate-900"
>
  <div
    class="grid grid-cols-2 items-center divide-x divide-y divide-slate-100 text-center dark:divide-slate-800"
    role="list"
    aria-label="Distribución por tipo de cuenta"
  >
    @for (column of columns(); track column.type) {
      <div
        role="listitem"
        class="flex items-center justify-between gap-2 rounded-xl px-2.5 py-2 transition-all hover:bg-slate-50 active:scale-95 dark:hover:bg-slate-800/60"
      >
        <div class="min-w-0 text-left">
          <p
            class="truncate text-[10px] font-semibold tracking-wide uppercase"
            [class]="column.type | accountTypeLabelClass"
          >
            {{ column.label }}
          </p>
          <span class="mt-0.5 block text-[9px] font-medium text-slate-500 dark:text-slate-400">
            {{ countLabel(column.count) }}
          </span>
        </div>

        <p
          class="shrink-0 truncate text-xs font-bold tabular-nums"
          [class]="balanceClass(column)"
        >
          {{ column.total | privacyCurrency }}
        </p>
      </div>
    }
  </div>
</div>
