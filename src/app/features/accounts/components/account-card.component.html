<a
  [routerLink]="['/accounts', account().id]"
  class="flex items-center gap-3 rounded-2xl border border-slate-200 bg-white px-3.5 py-2.5 shadow-sm focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:ring-offset-2 md:hidden dark:border-slate-800 dark:bg-slate-900 dark:focus-visible:ring-offset-slate-950"
  [attr.aria-label]="'Ver detalle de ' + account().name"
>
  <span
    class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full"
    [style.background-color]="palette().chip"
  >
    <app-icon [name]="accountIcon()" size="16" class="h-4 w-4 text-white" />
  </span>

  <span class="min-w-0 flex-1">
    <span class="flex items-center gap-1.5">
      <span class="truncate text-sm font-semibold text-slate-900 dark:text-white">
        {{ account().name }}
      </span>
      @if (excluded()) {
        <span class="inline-flex shrink-0 items-center" title="Fuera del saldo disponible">
          <app-icon name="eye-off" size="14" class="h-3.5 w-3.5 text-slate-400" />
          <span class="sr-only">No incluido en el saldo disponible</span>
        </span>
      }
      @if (pinned()) {
        <app-icon
          name="home"
          size="14"
          class="h-3.5 w-3.5 shrink-0 text-slate-300 dark:text-slate-600"
        />
      }
    </span>
  </span>

  @if (hasGoal()) {
    <span class="w-16 shrink-0 sm:w-20" title="Progreso de la meta">
      <span class="block h-1.5 overflow-hidden rounded-full bg-slate-100 dark:bg-slate-800">
        <span
          class="block h-full rounded-full"
          [style.width.%]="goalPercentage()"
          [style.background-color]="palette().bar"
        ></span>
      </span>
      <span class="sr-only">Progreso de la meta del {{ account().name }}</span>
    </span>
  }

  <span class="shrink-0 text-sm font-bold tabular-nums text-slate-900 dark:text-white">
    {{ formatCurrency(account().currentBalance) }}
  </span>

  <app-icon
    name="chevron-right"
    size="16"
    class="h-4 w-4 shrink-0 text-slate-300 dark:text-slate-600"
  />
</a>

<div class="relative hidden md:block">
  <a
    [routerLink]="['/accounts', account().id]"
    class="block rounded-2xl focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:ring-offset-2 dark:focus-visible:ring-offset-slate-950"
    [attr.aria-label]="'Ver detalle de ' + account().name"
  >
    <app-stat-card
      [title]="account().name"
      [amount]="account().currentBalance"
      [color]="account().color ?? 'indigo'"
      [goal]="account().targetGoal"
      [subtext]="subtext()"
      [note]="account().note"
    />
  </a>

  @if (account().isRoot) {
    <span
      role="status"
      class="absolute -top-3 left-5 z-20 rounded-full bg-slate-600 px-2 py-0.5 text-[10px] font-semibold uppercase tracking-wide text-white shadow-sm ring-1 ring-white/60 dark:bg-slate-400 dark:text-slate-950"
    >
      Cuenta base
    </span>
  }

  @if (pinned()) {
    <div
      class="absolute right-4 top-12 p-0.5 transition dark:hover:bg-slate-800 dark:focus-visible:ring-offset-slate-900"
      title="Fijado en inicio"
    >
      <app-icon name="home" size="14" class="h-3.5 w-3.5 text-slate-300 dark:text-slate-600" />
    </div>
  }
</div>
