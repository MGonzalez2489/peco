<section class="space-y-5">
  <div class="flex items-center justify-between gap-4">
    <div class="min-w-0">
      <h1 class="text-2xl font-bold tracking-tight text-slate-900 dark:text-white">Movimientos</h1>
      <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">
        {{ filteredMovements().length }} movimiento{{
          filteredMovements().length === 1 ? '' : 's'
        }}
        registrado{{ filteredMovements().length === 1 ? '' : 's' }}
      </p>
    </div>

    <button
      type="button"
      (click)="filtersOpen.set(true)"
      aria-label="Abrir filtros de movimientos"
      class="inline-flex items-center justify-center gap-2 rounded-lg p-2 text-slate-500 transition hover:bg-slate-100 hover:text-slate-900 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:ring-offset-2 dark:text-slate-400 dark:hover:bg-slate-800 dark:hover:text-white dark:focus-visible:ring-offset-slate-950 md:rounded-xl md:border md:border-slate-200 md:bg-white md:px-4 md:py-2.5 md:text-sm md:font-semibold md:text-slate-700 md:shadow-sm md:hover:border-indigo-300 md:hover:bg-transparent md:hover:text-slate-900 md:dark:border-slate-700 md:dark:bg-slate-900 md:dark:text-slate-300 md:dark:hover:border-indigo-500/60 md:dark:hover:bg-transparent md:dark:hover:text-white"
    >
      <svg
        class="h-6 w-6 md:h-4 md:w-4"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="1.8"
        stroke="currentColor"
        aria-hidden="true"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M10.5 6h9.75M10.5 6a1.5 1.5 0 1 1-3 0m3 0a1.5 1.5 0 1 0-3 0M3.75 6H7.5m3 12h9.75m-9.75 0a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m-3.75 0H7.5m9-6h3.75m-3.75 0a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m-9.75 0h9.75"
        />
      </svg>
      <span class="hidden md:inline">Filtros</span>
      @if (activeFilterCount() > 0) {
        <span
          class="inline-flex h-5 min-w-5 items-center justify-center rounded-full bg-indigo-600 px-1.5 text-xs font-bold text-white"
          aria-label="{{ activeFilterCount() }} filtros activos"
        >
          {{ activeFilterCount() }}
        </span>
      }
    </button>
  </div>

  <app-movement-list
    [movements]="filteredMovements()"
    emptyMessage="No hay movimientos con los filtros seleccionados."
  />
</section>

<app-filtro-movimientos-modal
  [isOpen]="filtersOpen()"
  [categories]="categories()"
  [filters]="currentFilters()"
  (filtersChanged)="applyFilters($event)"
  (closed)="filtersOpen.set(false)"
/>
