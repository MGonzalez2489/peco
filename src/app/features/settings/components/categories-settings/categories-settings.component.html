<section aria-labelledby="categories-settings-title" class="space-y-6">
  <div class="flex flex-wrap items-start justify-between gap-3">
    <div class="min-w-0">
      <h2
        id="categories-settings-title"
        class="hidden text-lg font-bold tracking-tight text-slate-900 md:block dark:text-white"
      >
        Categorías
      </h2>
      <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">
        Personaliza tus categorías, íconos y colores
      </p>
    </div>

    <button
      type="button"
      (click)="openCreate()"
      class="inline-flex shrink-0 items-center gap-2 rounded-xl bg-indigo-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm shadow-indigo-600/30 transition hover:bg-indigo-500 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:ring-offset-2 dark:focus-visible:ring-offset-slate-900"
    >
      <app-icon name="plus" size="16" strokeWidth="2.5" class="h-4 w-4" />
      Nueva categoría
    </button>
  </div>

  <ul class="space-y-2">
    @for (category of categories(); track category.id) {
      <li
        class="flex items-center gap-4 rounded-2xl border border-slate-200 bg-white p-4 transition hover:border-slate-300 dark:border-slate-800 dark:bg-slate-900 dark:hover:border-slate-700"
      >
        <span
          class="flex h-11 w-11 shrink-0 items-center justify-center rounded-2xl"
          [style.background-color]="toSoftCategoryColor(category.color)"
        >
          <app-icon
            [name]="category.icon"
            size="20"
            class="h-5 w-5"
            [style.color]="category.color"
          />
        </span>

        <span class="min-w-0 flex-1">
          <span class="block truncate text-sm font-semibold text-slate-900 dark:text-white">
            {{ category.displayName }}
          </span>
          <span
            class="mt-1 inline-flex items-center rounded-full bg-slate-100 px-2 py-0.5 text-[11px] font-medium text-slate-600 dark:bg-slate-800 dark:text-slate-300"
          >
            {{ applyTypeLabel(category.applyType) }}
          </span>
        </span>

        @if (category.isRoot) {
          <span
            class="inline-flex shrink-0 items-center gap-1.5 rounded-full border border-slate-200 px-2.5 py-1 text-[11px] font-medium text-slate-500 dark:border-slate-700 dark:text-slate-400"
          >
            <app-icon name="lock" size="12" class="h-3 w-3" />
            Predeterminada
          </span>
        } @else {
          <span class="flex shrink-0 items-center gap-1">
            <button
              type="button"
              (click)="openEdit(category)"
              [attr.aria-label]="'Editar categoría ' + category.displayName"
              [title]="'Editar ' + category.displayName"
              class="rounded-lg p-2 text-slate-500 transition hover:bg-slate-100 hover:text-indigo-600 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 dark:text-slate-400 dark:hover:bg-slate-800 dark:hover:text-indigo-400"
            >
              <app-icon name="pencil" size="16" class="h-4 w-4" />
            </button>
            <button
              type="button"
              (click)="openDelete(category)"
              [attr.aria-label]="'Eliminar categoría ' + category.displayName"
              [title]="'Eliminar ' + category.displayName"
              class="rounded-lg p-2 text-slate-500 transition hover:bg-rose-50 hover:text-rose-600 focus:outline-none focus-visible:ring-2 focus-visible:ring-rose-500 dark:text-slate-400 dark:hover:bg-rose-500/10 dark:hover:text-rose-400"
            >
              <app-icon name="trash-2" size="16" class="h-4 w-4" />
            </button>
          </span>
        }
      </li>
    }
  </ul>
</section>

<app-category-form-modal
  [isOpen]="formOpen()"
  [category]="categoryToEdit()"
  (close)="closeForm()"
  (save)="saveCategory($event)"
/>

<app-category-delete-confirm-modal
  [isOpen]="deleteOpen()"
  [category]="categoryToDelete()"
  (close)="closeDelete()"
  (confirm)="confirmDelete()"
/>
