<app-modal [isOpen]="isOpen()" title="Eliminar categoría" (closed)="close.emit()">
  <div class="mt-5 space-y-4">
    <p class="text-sm leading-relaxed text-slate-600 dark:text-slate-300">
      ¿Estás seguro de que deseas eliminar la categoría
      <strong class="font-semibold text-slate-900 dark:text-white">{{
        category()?.displayName ?? ''
      }}</strong
      >?
    </p>

    <p
      class="flex gap-2 rounded-xl bg-amber-50 px-3 py-2.5 text-sm leading-relaxed text-amber-800 dark:bg-amber-500/10 dark:text-amber-200"
    >
      <app-icon name="info" size="16" class="mt-0.5 h-4 w-4 shrink-0" />
      <span>
        Todos los movimientos e ingresos/gastos programados asociados a esta categoría pasarán
        automáticamente a la categoría Otros.
      </span>
    </p>

    <div class="flex flex-col-reverse gap-2 sm:flex-row sm:justify-end">
      <button
        type="button"
        (click)="close.emit()"
        class="rounded-xl border border-slate-200 px-4 py-2.5 text-sm font-semibold text-slate-700 transition hover:bg-slate-100 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 dark:border-slate-700 dark:text-slate-200 dark:hover:bg-slate-800"
      >
        Cancelar
      </button>
      <button
        type="button"
        (click)="confirm.emit()"
        class="inline-flex items-center justify-center gap-2 rounded-xl bg-rose-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm shadow-rose-600/30 transition hover:bg-rose-500 focus:outline-none focus-visible:ring-2 focus-visible:ring-rose-500 focus-visible:ring-offset-2 dark:focus-visible:ring-offset-slate-900"
      >
        <app-icon name="trash-2" size="16" class="h-4 w-4" />
        Eliminar y reasignar
      </button>
    </div>
  </div>
</app-modal>
