<section aria-labelledby="user-preferences-title" class="space-y-6">
  <div>
    <h2
      id="user-preferences-title"
      class="hidden text-lg font-bold tracking-tight text-slate-900 md:block dark:text-white"
    >
      Preferencias
    </h2>
    <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">
      Elige cómo se ve la aplicación en este dispositivo.
    </p>
  </div>

  <!-- APARIENCIA -->
  <div class="space-y-3">
    <h3
      class="text-sm font-semibold uppercase tracking-wide text-slate-500 dark:text-slate-400"
    >
      Apariencia
    </h3>

    <div
      class="divide-y divide-slate-100 overflow-hidden rounded-2xl border border-slate-200/80 bg-white shadow-sm dark:divide-slate-800 dark:border-slate-800 dark:bg-slate-900"
    >
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 p-4">
        <div class="flex min-w-0 items-center gap-3">
          <div class="min-w-0">
            <p class="text-sm font-semibold text-slate-900 dark:text-white">Tema</p>
            <p class="text-xs text-slate-500 dark:text-slate-400">
              Elige el tema visual de la aplicación.
            </p>
          </div>
        </div>

        <div class="w-full shrink-0 md:w-44">
          <app-select
            controlId="pref-theme"
            ariaLabel="Tema"
            [options]="themeOptions"
            [value]="theme()"
            (valueChange)="onThemeChange($event)"
          />
        </div>
      </div>
    </div>
  </div>

  <!-- CUENTAS -->
  <div class="space-y-3">
    <h3
      class="text-sm font-semibold uppercase tracking-wide text-slate-500 dark:text-slate-400"
    >
      Cuentas
    </h3>

    <div
      class="divide-y divide-slate-100 overflow-hidden rounded-2xl border border-slate-200/80 bg-white shadow-sm dark:divide-slate-800 dark:border-slate-800 dark:bg-slate-900"
    >
      <app-setting-toggle-row
        title="Esconder balances"
        description="Muestra o esconde los balances de las cuentas en toda la aplicación."
        [checked]="hideBalance()"
        (checkedChange)="onHideBalanceChange()"
      />
    </div>
  </div>

  <!-- MOVIMIENTOS -->
  <div class="space-y-3">
    <h3
      class="text-sm font-semibold uppercase tracking-wide text-slate-500 dark:text-slate-400"
    >
      Movimientos
    </h3>

    <div
      class="divide-y divide-slate-100 overflow-hidden rounded-2xl border border-slate-200/80 bg-white shadow-sm dark:divide-slate-800 dark:border-slate-800 dark:bg-slate-900"
    >
      <app-setting-toggle-row
        title="Esconder reversiones"
        description="Oculta de las listas los movimientos que fueron revertidos y sus respectivas contra-reversiones para mantener un historial limpio."
        [checked]="hideReversal()"
        (checkedChange)="onHideReversalChange()"
      />
    </div>
  </div>
</section>
