@if (canInstall()) {
  <section
    class="fixed inset-x-4 bottom-20 z-50 rounded-2xl bg-white p-4 shadow-2xl ring-1 ring-slate-200 dark:bg-slate-900 dark:ring-slate-700 sm:mx-auto sm:max-w-md"
    role="region"
    aria-label="Instalación de Peco"
  >
    <div class="flex items-start gap-3">
      <div
        class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-indigo-600 text-white shadow-sm"
      >
        <svg
          class="h-5 w-5"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="2"
          stroke="currentColor"
          aria-hidden="true"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M3 9.75 13.5 3v7.5L21 9.75 10.5 16.5V9M3 14.25 13.5 21v-7.5L3 14.25Z"
          />
        </svg>
      </div>

      <div class="min-w-0 flex-1">
        <p class="text-sm font-semibold text-slate-900 dark:text-white">
          Instala Peco en tu celular
        </p>
        <p class="mt-0.5 text-xs leading-relaxed text-slate-500 dark:text-slate-400">
          Acceso rápido desde tu pantalla de inicio y uso sin conexión
        </p>

        <div class="mt-3 flex flex-wrap items-center gap-2">
          <button
            type="button"
            (click)="install()"
            class="rounded-xl bg-indigo-600 px-4 py-2 text-sm font-semibold text-white shadow-sm shadow-indigo-600/30 transition hover:bg-indigo-500 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:ring-offset-2 dark:focus-visible:ring-offset-slate-900"
          >
            Instalar
          </button>
          <button
            type="button"
            (click)="dismiss()"
            class="rounded-xl px-4 py-2 text-sm font-semibold text-slate-600 transition hover:text-slate-900 focus:outline-none focus-visible:ring-2 focus-visible:ring-slate-400 focus-visible:ring-offset-2 dark:text-slate-300 dark:hover:text-white dark:focus-visible:ring-offset-slate-900"
          >
            Ahora no
          </button>
        </div>
      </div>
    </div>
  </section>
}
