<div
  class="flex h-full flex-col rounded-2xl border border-slate-200 bg-white p-5 shadow-sm transition-shadow hover:shadow-md dark:border-slate-800 dark:bg-slate-900"
>
  <div class="flex items-center justify-between gap-2">
    <p class="truncate text-sm font-medium text-slate-500 dark:text-slate-400">
      {{ title() }}
    </p>
    <span aria-hidden="true" class="h-2.5 w-2.5 shrink-0 rounded-full {{ palette().chip }}"></span>
  </div>

  <p class="mt-2 text-2xl font-bold tracking-tight {{ palette().text }}">
    {{ amount() | currency: 'USD' : 'symbol' : '1.2-2' }}
  </p>

  @if (subtext(); as text) {
    <p class="mt-1 text-xs text-slate-500 dark:text-slate-400">{{ text }}</p>
  }

  @if (goal(); as target) {
    <div class="mt-4" [attr.aria-label]="'Progress toward the goal of ' + title()">
      <div
        class="flex items-center justify-between text-xs font-medium text-slate-500 dark:text-slate-400"
      >
        <span>Goal</span>
        <span>{{ goalPercentage() }}%</span>
      </div>
      <div class="mt-1.5 h-2 w-full overflow-hidden rounded-full bg-slate-100 dark:bg-slate-800">
        <div
          class="h-full rounded-full transition-all {{ palette().bar }}"
          [style.width.%]="goalPercentage()"
        ></div>
      </div>
    </div>
  }
</div>
