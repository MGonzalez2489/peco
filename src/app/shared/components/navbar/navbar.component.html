<nav
  class="sticky top-0 z-30 border-b border-slate-200 bg-white/95 backdrop-blur dark:border-slate-800 dark:bg-slate-950/95"
>
  <div
    class="mx-auto flex max-w-5xl items-center justify-between gap-2 px-3 py-3 md:px-4 md:py-3.5"
  >
    <a
      routerLink="/dashboard"
      class="flex shrink-0 items-center gap-2 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:ring-offset-2 md:hidden dark:focus-visible:ring-offset-slate-950"
      aria-label="Peco — Inicio"
    >
      <img src="assets/icons/icon.svg" class="size-8" alt="" />
      <span class="text-lg font-bold tracking-tight text-slate-900 dark:text-white">Peco</span>
    </a>

    <button
      type="button"
      (click)="toggleSidebar.emit()"
      class="hidden rounded-lg p-2 text-slate-600 transition hover:bg-slate-100 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:ring-offset-2 md:inline-flex dark:text-slate-300 dark:hover:bg-slate-800 dark:focus-visible:ring-offset-slate-950"
      aria-label="Alternar menú de navegación"
      [attr.aria-expanded]="!sidebarCollapsed()"
    >
      <app-nav-icon name="menu" sizeClass="h-6 w-6" />
    </button>

    <button
      type="button"
      (click)="capture.emit()"
      class="hidden items-center gap-2 rounded-xl bg-indigo-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm shadow-indigo-600/30 transition hover:bg-indigo-500 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:ring-offset-2 md:inline-flex dark:focus-visible:ring-offset-slate-950"
    >
      <app-nav-icon name="plus" sizeClass="h-4 w-4" />
      <span>Registrar</span>
    </button>

    <button
      type="button"
      (click)="toggleMenu.emit()"
      class="rounded-lg p-2 text-slate-600 transition hover:bg-slate-100 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:ring-offset-2 md:hidden dark:text-slate-300 dark:hover:bg-slate-800 dark:focus-visible:ring-offset-slate-950"
      aria-label="Abrir menú de navegación"
      aria-haspopup="true"
      [attr.aria-expanded]="menuOpen()"
    >
      <app-nav-icon name="menu" sizeClass="h-6 w-6" />
    </button>
  </div>
</nav>
