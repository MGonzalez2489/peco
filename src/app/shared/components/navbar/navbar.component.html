<nav
  class="sticky top-0 z-30 border-b border-slate-200 bg-white/95 backdrop-blur dark:border-slate-800 dark:bg-slate-950/95 md:pl-64"
>
  <div class="mx-auto flex max-w-5xl items-center gap-2 px-3 py-3 md:px-4 md:py-3.5">
    <a
      routerLink="/dashboard"
      class="flex shrink-0 items-center gap-2 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:ring-offset-2 dark:focus-visible:ring-offset-slate-950"
      aria-label="Peco — Inicio"
    >
      <img src="assets/icons/icon.svg" class="size-8" alt="" />
      <span class="text-lg font-bold tracking-tight text-slate-900 dark:text-white">Peco</span>
    </a>

    <div class="ml-auto flex items-center gap-2">
      <button
        type="button"
        (click)="capture.emit()"
        class="hidden items-center gap-2 rounded-xl bg-indigo-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm shadow-indigo-600/30 transition hover:bg-indigo-500 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:ring-offset-2 dark:focus-visible:ring-offset-slate-950 md:inline-flex"
      >
        <svg
          class="h-4 w-4"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="2.5"
          stroke="currentColor"
          aria-hidden="true"
        >
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
        </svg>
        <span>Registrar</span>
      </button>

      <button
        type="button"
        (click)="capture.emit()"
        class="inline-flex h-10 w-10 items-center justify-center rounded-xl bg-indigo-600 text-white shadow-sm shadow-indigo-600/30 transition hover:bg-indigo-500 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:ring-offset-2 dark:focus-visible:ring-offset-slate-950 md:hidden"
        aria-label="Registrar movimiento rápido"
      >
        <svg
          class="h-5 w-5"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="2.4"
          stroke="currentColor"
          aria-hidden="true"
        >
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
        </svg>
      </button>

      <button
        type="button"
        (click)="toggleMenu.emit()"
        class="rounded-lg p-2 text-slate-600 transition hover:bg-slate-100 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:ring-offset-2 dark:text-slate-300 dark:hover:bg-slate-800 dark:focus-visible:ring-offset-slate-950 md:hidden"
        aria-label="Abrir menú de navegación"
        aria-haspopup="true"
        [attr.aria-expanded]="menuOpen()"
      >
        <app-nav-icon name="menu" sizeClass="h-6 w-6" />
      </button>
    </div>
  </div>

  <ul class="flex items-center gap-1 overflow-x-auto px-2 pb-2 no-scrollbar md:hidden">
    @for (item of quickLinks; track item.route) {
      <li class="shrink-0">
        <a
          [routerLink]="item.route"
          [attr.aria-current]="isItemActive(item.route) ? 'page' : null"
          class="flex items-center gap-1.5 rounded-lg px-3 py-2 text-xs font-semibold transition focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:ring-offset-2 dark:focus-visible:ring-offset-slate-950"
          [class]="linkClasses(item.route)"
        >
          <app-nav-icon [name]="item.icon" sizeClass="h-4 w-4" />
          <span>{{ item.label }}</span>
        </a>
      </li>
    }
  </ul>
</nav>
