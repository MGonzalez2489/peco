<label
  class="flex items-center justify-between gap-4 p-4 transition-colors"
  [class.cursor-pointer]="!disabled()"
  [class.cursor-not-allowed]="disabled()"
  [class.opacity-50]="disabled()"
>
  <span class="min-w-0">
    <span class="block text-sm font-semibold text-slate-900 dark:text-white">
      {{ title() }}
    </span>
    <span class="mt-0.5 block text-xs text-slate-500 dark:text-slate-400">
      {{ description() }}
    </span>
  </span>

  <span class="relative inline-flex shrink-0 items-center">
    <input
      type="checkbox"
      role="switch"
      class="peer sr-only"
      [checked]="checked()"
      [disabled]="disabled()"
      (change)="onCheckboxChange($event)"
    />
    <span
      class="h-6 w-11 rounded-full bg-slate-200 transition-colors peer-checked:bg-indigo-600 peer-focus-visible:ring-2 peer-focus-visible:ring-indigo-500 peer-focus-visible:ring-offset-2 dark:bg-slate-700 dark:peer-checked:bg-indigo-500 dark:peer-focus-visible:ring-offset-slate-900"
    ></span>
    <span
      class="pointer-events-none absolute left-0.5 top-0.5 h-5 w-5 rounded-full bg-white shadow transition-transform peer-checked:translate-x-5"
    ></span>
  </span>
</label>
