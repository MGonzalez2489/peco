<button
  #trigger
  type="button"
  role="combobox"
  [id]="controlId() || null"
  [attr.aria-expanded]="isOpen()"
  [attr.aria-controls]="isOpen() ? listboxId : null"
  [attr.aria-activedescendant]="activeDescendantId()"
  [attr.aria-label]="accessibleLabel()"
  [attr.aria-invalid]="invalid() ? 'true' : null"
  aria-haspopup="listbox"
  [disabled]="disabled()"
  (click)="toggleOpen()"
  (keydown)="onKeydown($event)"
  class="flex w-full items-center gap-2 rounded-xl border border-slate-300 bg-white px-3 py-2.5 text-left shadow-sm transition focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 disabled:cursor-not-allowed disabled:opacity-60 dark:border-slate-700 dark:bg-slate-800"
  [class.border-rose-400]="invalid()"
  [class.dark:border-rose-500]="invalid()"
>
  <span class="flex min-w-0 flex-1 items-center gap-2">
    @if (selectedOption(); as option) {
      @if (option.icon) {
        <app-icon
          [name]="option.icon"
          size="16"
          class="h-4 w-4 shrink-0 text-slate-500 dark:text-slate-400"
        />
      }
      @if (option.color) {
        <span
          aria-hidden="true"
          class="h-2.5 w-2.5 shrink-0 rounded-full"
          [style.background-color]="option.color"
        ></span>
      }
      <span class="truncate text-sm font-medium text-slate-900 dark:text-white">
        {{ option.label }}
      </span>
    } @else {
      <span class="truncate text-sm text-slate-400 dark:text-slate-500">{{ placeholder() }}</span>
    }
  </span>

  <app-icon
    name="chevron-down"
    size="16"
    class="h-4 w-4 shrink-0 text-slate-400 transition-transform dark:text-slate-500"
    [class.rotate-180]="isOpen()"
  />
</button>

@if (isOpen() && options().length > 0) {
  <ul
    #list
    [id]="listboxId"
    role="listbox"
    [attr.aria-label]="accessibleLabel()"
    class="absolute inset-x-0 top-full z-30 mt-1 max-h-56 overflow-y-auto rounded-xl border border-slate-200 bg-white p-1 shadow-lg shadow-slate-900/10 dark:border-slate-700 dark:bg-slate-800 dark:shadow-black/40"
  >
    @for (option of options(); track option.value; let i = $index) {
      <li
        [id]="optionId(i)"
        role="option"
        [attr.aria-selected]="isSelected(option.value)"
        (click)="selectOption(option)"
        (mousemove)="setActiveIndex(i)"
        class="flex cursor-pointer items-center gap-2 rounded-lg px-2.5 py-2 text-sm transition hover:bg-slate-100 dark:hover:bg-slate-700/70"
        [class.bg-indigo-50]="i === activeIndex()"
        [class.dark:bg-indigo-500/20]="i === activeIndex()"
      >
        @if (option.icon) {
          <app-icon
            [name]="option.icon"
            size="16"
            class="h-4 w-4 shrink-0 text-slate-500 dark:text-slate-400"
          />
        }
        @if (option.color) {
          <span
            aria-hidden="true"
            class="h-2.5 w-2.5 shrink-0 rounded-full"
            [style.background-color]="option.color"
          ></span>
        }
        <span
          class="min-w-0 flex-1 truncate text-slate-700 dark:text-slate-200"
          [class.font-semibold]="isSelected(option.value)"
        >
          {{ option.label }}
        </span>
        @if (isSelected(option.value)) {
          <app-icon
            name="check"
            size="16"
            class="h-4 w-4 shrink-0 text-indigo-600 dark:text-indigo-400"
          />
        }
      </li>
    }
  </ul>
}
