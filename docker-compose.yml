services:
  mysql:
    image: mysql:8.4
    container_name: peco-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-peco}
      MYSQL_USER: ${DB_USER:-peco}
      MYSQL_PASSWORD: ${DB_PASSWORD:-peco}
    ports:
      - '${DB_PORT:-3306}:3306'
    volumes:
      - peco_mysql_data:/var/lib/mysql
    healthcheck:
      test:
        ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-uroot', '-p${DB_ROOT_PASSWORD:-root}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: peco-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-peco}
      DB_USER: ${DB_USER:-peco}
      DB_PASSWORD: ${DB_PASSWORD:-peco}
      DB_LOGGING: ${DB_LOGGING:-false}
    ports:
      - '${API_PORT:-3000}:3000'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: peco-web
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-8080}:80'

volumes:
  peco_mysql_data:
