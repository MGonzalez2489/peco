services:
  mysql:
    image: mysql:8.4
    container_name: peco-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DATABASE_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DATABASE_NAME:-peco}
      MYSQL_USER: ${DATABASE_USER:-peco}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:-peco}
    ports:
      - '${DATABASE_PORT:-3306}:3306'
    volumes:
      - peco_mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          'CMD',
          'mysqladmin',
          'ping',
          '-h',
          'localhost',
          '-uroot',
          '-p${DATABASE_ROOT_PASSWORD:-root}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: peco-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      TZ: UTC
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
      DATABASE_NAME: ${DATABASE_NAME:-peco}
      DATABASE_USER: ${DATABASE_USER:-peco}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-peco}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-only-access-secret-not-for-production-01}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-only-refresh-secret-not-for-production-02}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-capture}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
    ports:
      - '${API_PORT:-3000}:3000'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: peco-web
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-8080}:80'

volumes:
  peco_mysql_data:
